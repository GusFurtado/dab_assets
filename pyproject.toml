[project]
name = "dab-wiki"
version = "3.0.0"
description = "Raspagem de tabelas da Wikipedia que alimentam o módulo `wiki` do DadosAbertosBrasil."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Gustavo Furtado", email = "gustavofurtado2@gmail.com"},
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "requests>=2.32",
]

[project.scripts]
dab-wiki = "dab_wiki.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["exemplos"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "SIM"]
ignore = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "online: consulta a Wikipedia e depende de rede",
]
addopts = "-m 'not online'"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
